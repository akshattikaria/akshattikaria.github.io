<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Akshat Tikaria | Computer Engineering Student</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f8;--surface:#fff;--ink:#13202b;--muted:#4d5f6e;--line:#d5dce2;--accent:#1f4fd8;--accent-ink:#fff;--chip:#e6ecf7;
--head:'Bricolage Grotesque',system-ui,sans-serif;--body:'IBM Plex Sans',system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1820;--surface:#16232d;--ink:#e8eef3;--muted:#a3b3c0;--line:#2a3b48;--accent:#7ea2ff;--accent-ink:#0e1820;--chip:#203245}}
:root[data-theme="dark"]{--bg:#0e1820;--surface:#16232d;--ink:#e8eef3;--muted:#a3b3c0;--line:#2a3b48;--accent:#7ea2ff;--accent-ink:#0e1820;--chip:#203245}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(72px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--body)}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:-999px;top:8px;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:6px;z-index:10}
.skip:focus{left:8px}
header.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:0 16px}
.nav-in{max-width:960px;margin:auto;display:flex;align-items:center;gap:8px;min-height:56px}
.nav-in nav{display:flex;gap:2px;overflow-x:auto;flex:1}
.nav-in nav a{color:var(--muted);text-decoration:none;padding:12px 12px;border-radius:6px;white-space:nowrap;font-weight:500;min-height:44px}
.nav-in nav a[aria-current="true"]{color:var(--ink);box-shadow:inset 0 -3px var(--accent)}
.nav-in nav a:hover{color:var(--ink)}
button{font:inherit;cursor:pointer}
.icon-btn{min-width:44px;min-height:44px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px}
main{max-width:960px;margin:auto;padding:0 16px 64px}
.hero{padding:72px 0 40px}
.hero h1{font:700 clamp(2.6rem,9vw,5.2rem)/1 var(--head);letter-spacing:-.03em;margin:0 0 16px}
.hero p{max-width:60ch;font-size:1.15rem;color:var(--muted);margin:0 0 24px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:hover{border-color:var(--accent)}
section{padding:40px 0;border-top:1px solid var(--line)}
h2{font:700 1.9rem/1.2 var(--head);margin:0 0 20px;letter-spacing:-.01em}
h3{font:700 1.2rem/1.3 var(--head);margin:0}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:14px}
.item .meta{color:var(--muted);font-size:.95rem;margin:2px 0 8px}
.item ul{margin:8px 0 0;padding-left:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.chip{background:var(--chip);color:var(--ink);border-radius:999px;padding:3px 12px;font-size:.88rem;border:1px solid transparent}
button.chip{min-height:44px;padding:0 16px;font-size:.95rem;margin:0}
button.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--accent);font-weight:500}
.filters{margin-bottom:16px}
.count{color:var(--muted);margin:0 0 12px;font-size:.95rem}
.skills dt{font-weight:500;margin-top:14px}
.skills dd{margin:6px 0 0}
.empty{color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:18px}
footer{max-width:960px;margin:auto;padding:24px 16px 40px;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line)}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="nav"><div class="nav-in">
  <nav id="nav" aria-label="Sections"></nav>
  <button class="icon-btn" id="theme" aria-label="Switch theme" title="Switch theme">◐</button>
</div></header>
<main id="main"></main>
<footer id="foot"></footer>

<script>
/* ============ EDIT YOUR CONTENT HERE ============
   Change any text, add or remove items in the lists, and the page updates.
   Keep the quotes and commas as they are. */
const DATA = {
  name: "Akshat Tikaria",
  tagline: "Computer Engineering student at VJTI, Mumbai",
  bio: "Third-year B.Tech student (MHT-CET State Rank 15) building applied AI systems, full-stack web apps and backend services. Interned at DRDO's CAIR and Sarv Webs.",
  email: "tikariaakshat@gmail.com",
  location: "Mumbai, India",
  links: {
    GitHub: "https://github.com/akshattikaria",
    LinkedIn: "https://www.linkedin.com/in/akshat-tikaria-ab25463a9"
  },
  experience: [
    { role: "Technical Intern", org: "CAIR, DRDO, Bengaluru", dates: "May 2026 to Aug 2026",
      points: ["Contributed to backend engineering and applied AI work at the Centre for Artificial Intelligence and Robotics, a Ministry of Defence R&D lab.",
               "Built software workflows under strict data-security and confidentiality rules."] },
    { role: "Software Development Intern", org: "Sarv Webs Pvt. Ltd.", dates: "May 2026 to Jun 2026",
      points: ["Built a preprocessing pipeline for an AI parser that turns synced mobile data into structured output using locally hosted models.",
               "Migrated data between Elasticsearch and PostgreSQL with schema integrity and zero data loss.",
               "Helped with backend QA by running guided test cases."] }
  ],
  projects: [
    { title: "HTE Administrative Q&A Assistant", note: "VJTI AI Hackathon 2026", tags: ["AI","Python"],
      stack: ["Python","Gemini Vision","ChromaDB","Sentence-Transformers","PyMuPDF","Streamlit"],
      summary: "A RAG assistant that answers questions from 80+ scanned government circulars.",
      points: ["OCR and extraction pipeline with PyMuPDF and Gemini Vision, with page-level English verification.",
               "Offline semantic search with BAAI/bge-small-en-v1.5 and ChromaDB: 91% retrieval hit-rate, 0 hallucinations in tests.",
               "Streamlit interface with cited answers, page numbers, relevance scores and cached PDF downloads."], link: "" },
    { title: "Student Success Hub", note: "Academic monitoring platform", tags: ["Web","Full-stack"],
      stack: ["React","TypeScript","Node.js","Express","Tailwind CSS","Vite"],
      summary: "A multi-role platform for spotting academic risk early and managing interventions.",
      points: ["Role-based dashboards for Student, Teacher, Advisor, HOD and Admin with permission guards.",
               "Risk scoring, automated intervention workflows, counseling sessions and department reports."], link: "" },
    { title: "Mental Wellbeing Web App", note: "", tags: ["Web","Full-stack"],
      stack: ["React","Node.js","Express","SQLite","JavaScript"],
      summary: "Self-assessments, mood tracking and guided breathing in one place.",
      points: ["Questionnaires and continuous mood tracking.","Support chatbot for on-demand guidance and resources."], link: "" },
    { title: "AI Gym Trainer with Diet Chatbot", note: "", tags: ["AI","Python"],
      stack: ["Python","OpenCV","MediaPipe","LangChain","Gemini API","Streamlit"],
      summary: "A real-time workout coach that counts reps and scores form from your webcam.",
      points: ["Pose estimation and joint-angle calculation with MediaPipe.",
               "LangChain diet assistant using Gemini with PDF-based retrieval."], link: "" },
    { title: "Hospital Management System", note: "", tags: ["Web","Full-stack"],
      stack: ["Python","Flask","SQLite","HTML5","CSS3","JavaScript"],
      summary: "Role-based hospital app for doctors, patients, receptionists and admins.",
      points: ["Live patient queue tracking and automated appointment scheduling.","Digitized consultation workflows with strict data integrity rules."], link: "" }
  ],
  skills: {
    "Languages": ["C++","Java","Python","JavaScript","TypeScript","SQL"],
    "Web": ["React","Node.js","Express","Flask","Tailwind CSS","Vite","REST APIs"],
    "AI and data": ["LangChain","Gemini API","OpenCV","MediaPipe","ChromaDB","Sentence-Transformers","NumPy"],
    "Databases and tools": ["PostgreSQL","Elasticsearch","SQLite","Git","GitHub","Streamlit"],
    "Core CS": ["Data Structures and Algorithms","OOP","DBMS","Operating Systems","Cybersecurity basics"]
  },
  education: [
    { title: "B.Tech, Computer Engineering (Third Year)", org: "Veermata Jijabai Technological Institute (VJTI), Mumbai", dates: "Expected 2028",
      note: "MHT-CET 99.995 percentile, State Rank 15." },
    { title: "Higher Secondary (Class XII)", org: "Ryan International School, Chembur", dates: "", note: "First Division" },
    { title: "Secondary (Class X)", org: "A.E.C.S-4, Mumbai", dates: "", note: "First Division" }
  ],
  certifications: [
    "Getting Started with Deep Learning, NVIDIA DLI (Jul 2026)",
    "Accelerating End-to-End Data Science Workflows, NVIDIA DLI (Jan 2026)",
    "Building LLM Applications With Prompt Engineering, NVIDIA DLI (Jan 2026)",
    "Job Bridge Program in AI, Unlox Edge with Trivion Technology (Mar 2026)",
    "Java Collections & Data Structures, AI for Better Life (Feb 2026)",
    "Java Essentials, AI for Better Life (Feb 2026)",
    "Cyber Security Learning Program, 1stop.ai at IIT Guwahati (Feb 2025)"
  ],
  activities: [
    "Rank 1 at the A.E.C.S-4 Science Exhibition three years in a row.",
    "Volunteer, The School Challenge Mumbai (Agastya International Foundation and J.P. Morgan).",
    "Volunteer, Annual Blood Donation Camp, Anushakti Nagar (Tata Memorial Foundation)."
  ],
  /* Add blog posts like: { title: "My post", url: "https://...", date: "Oct 2026" } */
  blog: []
};
/* ============ END OF EDITABLE CONTENT ============ */

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = (s, r = document) => r.querySelector(s);
const chips = a => `<div class="chips">${a.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>`;
const ul = a => `<ul>${a.map(p => `<li>${esc(p)}</li>`).join('')}</ul>`;
const sec = (id, title, body) => `<section id="${id}" aria-labelledby="${id}-h"><h2 id="${id}-h">${title}</h2>${body}</section>`;
const D = DATA;
const lk = Object.entries(D.links);

function projectCards(filter) {
  const list = D.projects.filter(p => filter === 'All' || p.tags.includes(filter));
  $('#count').textContent = `Showing ${list.length} of ${D.projects.length} projects`;
  $('#plist').innerHTML = list.map(p => `<article class="item"><h3>${esc(p.title)}</h3>
    <p class="meta">${esc(p.note || '')}</p><p style="margin:0">${esc(p.summary)}</p>${chips(p.stack)}
    <details><summary>Details</summary>${ul(p.points)}${p.link ? `<p><a href="${esc(p.link)}" target="_blank" rel="noopener">View code (opens in a new tab)</a></p>` : ''}</details></article>`).join('');
}

const tags = ['All', ...new Set(D.projects.flatMap(p => p.tags))];
const html = `
<div class="hero"><h1>${esc(D.name)}</h1><p>${esc(D.tagline)}. ${esc(D.bio)}</p>
<div class="btns"><a class="btn primary" href="#projects">See projects</a><a class="btn" href="mailto:${esc(D.email)}">Email me</a>
${lk.map(([k, v]) => `<a class="btn" href="${esc(v)}" target="_blank" rel="noopener">${esc(k)}<span class="sr" style="position:absolute;left:-999px"> (opens in a new tab)</span></a>`).join('')}</div></div>
${sec('experience', 'Experience', D.experience.map(e => `<div class="item"><h3>${esc(e.role)}</h3><p class="meta">${esc(e.org)} · ${esc(e.dates)}</p>${ul(e.points)}</div>`).join(''))}
${sec('projects', 'Projects', `<div class="filters chips" role="group" aria-label="Filter projects by type">${tags.map((t, i) => `<button class="chip" data-f="${esc(t)}" aria-pressed="${i === 0}">${esc(t)}</button>`).join('')}</div><p class="count" id="count" aria-live="polite"></p><div id="plist"></div>`)}
${sec('skills', 'Skills', `<dl class="skills" style="margin:0">${Object.entries(D.skills).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${chips(v).replace('chips"', 'chips" style="margin:0"')}</dd>`).join('')}</dl>`)}
${sec('education', 'Education', D.education.map(e => `<div class="item"><h3>${esc(e.title)}</h3><p class="meta">${esc(e.org)}${e.dates ? ' · ' + esc(e.dates) : ''}</p><p style="margin:0">${esc(e.note)}</p></div>`).join('')
  + `<h3 style="margin:24px 0 10px">Certifications</h3><div class="item">${ul(D.certifications).replace('<ul>', '<ul style="margin:0">')}</div>`)}
${sec('beyond', 'Activities and blog', `<div class="item"><h3>Honors and volunteering</h3>${ul(D.activities)}</div>
<div class="item"><h3>Blog</h3>${D.blog.length ? ul(D.blog.map(b => b.title)).replace(/<li>(.*?)<\/li>/g, (m, t) => { const b = D.blog.find(x => esc(x.title) === t); return `<li><a href="${esc(b.url)}" target="_blank" rel="noopener">${t}</a> ${esc(b.date || '')}</li>`; }) : '<p class="empty" style="margin:8px 0 0">No posts yet. Add your first one in the blog list at the top of this file.</p>'}</div>`)}
${sec('contact', 'Contact', `<p>Based in ${esc(D.location)}. The quickest way to reach me is email.</p><div class="btns"><a class="btn primary" href="mailto:${esc(D.email)}">${esc(D.email)}</a>${lk.map(([k, v]) => `<a class="btn" href="${esc(v)}" target="_blank" rel="noopener">${esc(k)}</a>`).join('')}</div>`)}`;

$('#main').innerHTML = html;
$('#foot').textContent = `© ${new Date().getFullYear()} ${D.name}`;
$('#nav').innerHTML = [['experience','Experience'],['projects','Projects'],['skills','Skills'],['education','Education'],['beyond','More'],['contact','Contact']]
  .map(([id, t]) => `<a href="#${id}">${t}</a>`).join('');

projectCards('All');
document.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('[data-f]').forEach(x => x.setAttribute('aria-pressed', x === b));
  projectCards(b.dataset.f);
}));

const links = [...document.querySelectorAll('#nav a')];
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) links.forEach(a => a.setAttribute('aria-current', a.getAttribute('href') === '#' + e.target.id));
}), { rootMargin: '-40% 0px -55% 0px' });
document.querySelectorAll('main section').forEach(s => io.observe(s));

const root = document.documentElement;
$('#theme').addEventListener('click', () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
});
try { const t = localStorage.getItem('theme'); if (t) root.dataset.theme = t; } catch (e) {}
</script>
</body>
</html>
